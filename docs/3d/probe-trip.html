  .label.tag { background: #fff; padding: 3px 8px; border-radius: 999px; font-size: 12px; text-shadow: none; box-shadow: 0 2px 8px rgba(15,20,27,.2); }
  .label.tag.pickup { color: #15803d; } .label.tag.dropoff { color: #b91c1c; }

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const TEXT = [{"title": "Больше не нужно спрашивать.", "text": "YoolLive показывает весь рейс: где грузовик, где он стоит и почему пропала связь. Водитель только отмечает шаги в приложении."}, {"title": "Груз создан за минуту", "text": "Вставьте ссылку из 2GIS, Яндекса или Google Maps, и адрес найдётся сам. Маршрут по дорогам и время в пути кабинет посчитает сразу."}, {"title": "Водитель по одной ссылке", "text": "Номер водителя не нужен. Отправьте ссылку в Telegram: водитель откроет её и примет груз одним касанием."}, {"title": "Погружен. С фото и на карте", "text": "Каждый шаг водитель отмечает кнопкой и прикладывает фото документов. Вам приходит уведомление, а на карте остаётся отметка там, где это случилось."}, {"title": "Вы видите, как он едет", "text": "Водителю ничего делать не нужно: телефон сам отправляет точки. В кабинете скорость, пройденные километры, время до прибытия и даже заряд телефона."}, {"title": "Стоит, и понятно почему", "text": "Обед в чайхане. Телефон сам выключает GPS и бережёт батарею, а в кабинете видно: стоит с 12:10. Звонить не нужно."}, {"title": "Перевал. Связи нет", "text": "На Камчике сеть пропадает. Приложение не теряет точки, а копит их в телефоне, хоть две недели. Кабинет честно пишет «нет данных» и не рисует зелёную точку."}, {"title": "Сеть вернулась, трек целый", "text": "Как только появилась связь, все точки уходят одной пачкой. Маршрут дорисовывается без дыр, как будто связь и не пропадала."}, {"title": "Клиент смотрит сам", "text": "Отправьте получателю ссылку. Он видит грузовик на карте без регистрации и не звонит вам каждые полчаса."}, {"title": "Доставлено", "text": "Водитель фотографирует накладную, вы подтверждаете доставку. Рейс уходит в историю: все шаги, фото и трек на месте."}, {"title": "Рейс в истории", "text": "Весь путь одним треком, без дыр: шаги, фото и время каждой точки остаются в кабинете."}];

// ── palette (from the landing map) ────────────────────────────────────────
const P = {
  land: 0xefece3, concrete: 0xe3e1db, casing: 0xcbc4b5, road: 0xfdfcf9, dash: 0xdcd5c6,
  fields: [0xdfe6c6, 0xe8e1c2, 0xd3dfb8, 0xebe4cc, 0xd9e3c2],
  trees: [0x8fae6e, 0x7fa262, 0x9cb87e, 0x78995c],
  walls: [0xeee6d6, 0xe8dfcc, 0xf1ebdf, 0xe4dccb],
  roofs: [0xc9cfd6, 0xd6cfc1, 0xbfc9d3, 0xcdc6b6],
  hills: [0xe6dec9, 0xddd1b6, 0xd3c5a5, 0xc8b893, 0xbcab84],
  blue: 0x2081f8, track: 0x2563eb, plan: 0x64748b, pending: 0x94a3b8,
};
const narrow = () => innerWidth < innerHeight;

// ── renderer, scene, light ────────────────────────────────────────────────
// quality switches for measuring on phones: ?dpr=1&shadows=0&soft=0&logz=0&aa=0
const Q = new URLSearchParams(location.search);
const QD = { dpr: Number(Q.get("dpr") || 1.75), shadows: Q.get("shadows") !== "0", soft: Q.get("soft") !== "0", logz: Q.get("logz") !== "0", aa: Q.get("aa") !== "0" };
const renderer = new THREE.WebGLRenderer({ antialias: QD.aa, logarithmicDepthBuffer: QD.logz });
renderer.setPixelRatio(Math.min(devicePixelRatio, QD.dpr));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = QD.shadows;
renderer.shadowMap.type = QD.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e7df);
scene.fog = new THREE.Fog(0xe9e7df, 200, 600);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, QD.logz ? 0.5 : 2, 9000);

const hemi = new THREE.HemisphereLight(0xfbf9f4, 0xb9b09a, 1.9);
const sun = new THREE.DirectionalLight(0xfff4e4, 1.55);
sun.castShadow = true;
const SM = narrow() ? 1024 : 2048;
sun.shadow.mapSize.set(SM, SM);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.5;
scene.add(hemi, sun, sun.target);

// ── materials, static batching ────────────────────────────────────────────
const mats = new Map();
const mat = (color, opts = {}) => {
  const key = color + JSON.stringify(opts);
  if (!mats.has(key)) mats.set(key, new THREE.MeshLambertMaterial({ color, ...opts }));
  return mats.get(key);
};
const winMat = new THREE.MeshLambertMaterial({ color: 0x5c6b7a, emissive: 0xffc96b, emissiveIntensity: 0 });
const lampMat = new THREE.MeshLambertMaterial({ color: 0xf3f0e6, emissive: 0xffe2a0, emissiveIntensity: 0 });

// Static things are built as groups of meshes, then merged per material.
const buckets = new Map();
function bake(obj, cast = true) {
  obj.updateMatrixWorld(true);
  obj.traverse((m) => {
    if (!m.isMesh || m.isInstancedMesh) return;
    const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()).applyMatrix4(m.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (!["position", "normal", "uv"].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute("uv", new THREE.Float32BufferAttribute(new Float32Array((g.attributes.position.count) * 2), 2));
    g.clearGroups();
    const key = m.material.uuid + (cast ? "c" : "");
    if (!buckets.has(key)) buckets.set(key, { m: m.material, cast, gs: [] });
    buckets.get(key).gs.push(g);
  });
}
function flush() {
  for (const { m, cast, gs } of buckets.values()) {
    const o = new THREE.Mesh(mergeGeometries(gs), m);
    o.castShadow = cast;
    o.receiveShadow = true;
    scene.add(o);
  }
  buckets.clear();
}
const M = (geo, m) => new THREE.Mesh(geo, m);
const box = (w, h, d, color, x, y, z, m) => {
  const o = M(new THREE.BoxGeometry(w, h, d), m || mat(color));
  o.position.set(x, y + h / 2, z);
  return o;
};

let seed = 2031;
const rnd = () => {
  seed = (seed + 0x6d2b79f5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const pick = (a) => a[Math.floor(rnd() * a.length)];
const smooth = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const clamp01 = (x) => Math.min(1, Math.max(0, x));

// ── ground ────────────────────────────────────────────────────────────────
{
  const g = M(new THREE.PlaneGeometry(6000, 6000), mat(P.land));
  g.rotation.x = -Math.PI / 2;
  g.receiveShadow = true;
  scene.add(g);
}

// ── road: Tashkent depot (south) → Fergana depot (north) ─────────────────
const road = new THREE.CatmullRomCurve3(
  [[6, 660], [4, 600], [0, 540], [-30, 450], [40, 330], [-35, 210], [48, 80], [-30, -60], [10, -190], [-25, -330], [20, -470], [-20, -600], [15, -720], [0, -830], [-4, -890], [-6, -935]]
    .map(([x, z]) => new THREE.Vector3(x, 0, z)), false, "centripetal");
const ROAD_LEN = road.getLength();
const N = 1600;
const pts = road.getSpacedPoints(N);
const tans = pts.map((_, i) => road.getTangentAt(i / N));
const uAtZ = (z) => { let i = 0; while (i < N && pts[i].z > z) i++; return i / N; };
const distToRoad = (x, z) => {
  let m = Infinity;
  for (let i = 0; i <= N; i += 4) m = Math.min(m, Math.hypot(pts[i].x - x, pts[i].z - z));
  return m;
};
const U = {
  dock: 9 / ROAD_LEN, gate: uAtZ(545), chaiIn: uAtZ(175), chai: uAtZ(84), chaiOut: uAtZ(20),
  passIn: uAtZ(-150), off: uAtZ(-255), on: uAtZ(-445), valley: uAtZ(-560), client: uAtZ(-610), fgGate: uAtZ(-835), drop: 1 - 9 / ROAD_LEN,
};

// a strip along the road between pts[a] and pts[b]; v runs along it
function ribbon(w, y, m, a = 0, b = N, period = 24) {
  const pos = [], uv = [], idx = [];
  for (let i = a; i <= b; i++) {
    const p = pts[i], t = tans[i];
    const nx = -t.z, nz = t.x;
    pos.push(p.x + nx * w / 2, y, p.z + nz * w / 2, p.x - nx * w / 2, y, p.z - nz * w / 2);
    const v = ((i - a) * ROAD_LEN) / N / period;
    uv.push(0, v, 1, v);
    if (i > a) { const k = (i - a - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const o = M(g, m);
  o.receiveShadow = true;
  o.userData = { a, b };
  return o;
}
// show the global range [g0, g1] (pts indices) of a ribbon
const showRange = (o, g0, g1) => {
  const s = Math.max(g0, o.userData.a), e = Math.min(g1, o.userData.b);
  o.geometry.setDrawRange((s - o.userData.a) * 6, Math.max(0, Math.floor(e - s)) * 6);
};
scene.add(ribbon(11, 0.03, mat(P.casing, { side: THREE.DoubleSide })), ribbon(9, 0.06, mat(P.road, { side: THREE.DoubleSide })));
{
  const n = Math.ceil(ROAD_LEN / 7);
  const dash = new THREE.InstancedMesh(new THREE.BoxGeometry(0.25, 0.02, 3), mat(P.dash), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
  let j = 0;
  for (let s = 20; s < ROAD_LEN - 20; s += 7) {
    const i = Math.round((s / ROAD_LEN) * N), p = pts[i], t = tans[i];
    q.setFromEuler(e.set(0, Math.atan2(t.x, t.z), 0));
    dash.setMatrixAt(j++, m.compose(new THREE.Vector3(p.x, 0.08, p.z), q, one));
  }
  dash.count = j;
  dash.receiveShadow = true;
  scene.add(dash);
}
const I = (u) => Math.round(u * N);

// ── textures ──────────────────────────────────────────────────────────────
const canvasTex = (w, h, draw) => {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const rowsTex = canvasTex(64, 64, (g) => { g.fillStyle = "#fff"; g.fillRect(0, 0, 64, 64); g.fillStyle = "rgba(110,125,70,0.22)"; for (let y = 0; y < 64; y += 16) g.fillRect(0, y, 64, 6); });
const cottonTex = canvasTex(64, 64, (g) => {
  g.fillStyle = "#d3dbc2"; g.fillRect(0, 0, 64, 64);
  g.fillStyle = "#fff";
  for (let y = 4; y < 64; y += 16) for (let x = 0; x < 64; x += 9) { g.beginPath(); g.arc(x + ((y / 16) % 2) * 4, y + 4, 2.6, 0, 7); g.fill(); }
});
const dashTex = canvasTex(4, 64, (g) => { g.fillStyle = "#fff"; g.fillRect(0, 0, 4, 34); });
const fieldMats = P.fields.map((c) => new THREE.MeshLambertMaterial({ color: c, map: rowsTex }));
const cottonMat = new THREE.MeshLambertMaterial({ color: 0xffffff, map: cottonTex });

// ── layout bookkeeping ───────────────────────────────────────────────────
const taken = [];
const free = (x, z, r) => taken.every((t) => Math.hypot(t.x - x, t.z - z) > t.r + r);
const CHAI = { x: 48 + 33, z: 82 };
taken.push({ x: CHAI.x, z: CHAI.z, r: 26 });

// ── depots ────────────────────────────────────────────────────────────────
function depot({ z0, z1, gateZ, wx0, wx1, wz0, wz1, ox, oz, parkX0, parkX1, parkZ0, parkZ1, lampsFrom, lampsTo }) {
  const g = new THREE.Group();
  const yard = M(new THREE.PlaneGeometry(260, z1 - z0), mat(P.concrete));
  yard.rotation.x = -Math.PI / 2;
  yard.position.set(0, 0.015, (z0 + z1) / 2);
  bake(yard, false);
  // fence, broken for the gate
  for (let x = -128; x < 128; x += 5) for (const z of [z0, z1]) if (!(z === gateZ && Math.abs(x) < 16)) g.add(box(3.4, 1.8, 0.25, 0xb3ab9d, x + 1.7, 0, z));
  for (let z = Math.min(z0, z1); z < Math.max(z0, z1); z += 5) for (const x of [-130, 130]) g.add(box(0.25, 1.8, 3.4, 0xb3ab9d, x, 0, z + 1.7));
  // gate: booth and a raised barrier
  g.add(box(3.2, 2.8, 3.2, 0xe8e2d4, -12, 0, gateZ), box(4, 0.3, 4, 0x8a96a8, -12, 2.8, gateZ));
  const bar = box(0.3, 9, 0.3, 0xd9534f, -9.5, 0.9, gateZ);
  g.add(bar);
  // warehouse: gable metal roof, dock doors facing the road
  const ww = wx1 - wx0, wd = Math.abs(wz1 - wz0), wcx = (wx0 + wx1) / 2, wcz = (wz0 + wz1) / 2;
  g.add(box(ww, 9, wd, 0xe9e4d8, wcx, 0, wcz));
  const s = new THREE.Shape();
  s.moveTo(-ww / 2 - 0.6, 0); s.lineTo(ww / 2 + 0.6, 0); s.lineTo(0, 4.5); s.closePath();
  const roof = M(new THREE.ExtrudeGeometry(s, { depth: wd + 1.2, bevelEnabled: false }), mat(0xc5ced8, { flatShading: true }));
  roof.position.set(wcx, 9, wcz - wd / 2 - 0.6);
  g.add(roof);
  const doorX = Math.abs(wx0) < Math.abs(wx1) ? wx0 - 0.06 : wx1 + 0.06;
  const out = -Math.sign(wcx); // towards the road
  for (let z = Math.min(wz0, wz1) + 8; z < Math.max(wz0, wz1) - 6; z += 12) {
    g.add(box(0.12, 4.2, 4.6, 0x5b6675, doorX, 0.6, z));
    g.add(box(0.3, 0.5, 5.4, 0x2b2f36, doorX + out * 0.2, 0.5, z));
    g.add(box(0.3, 0.5, 0.6, 0xf2c94c, doorX + out * 0.2, 0.5, z - 2.9), box(0.3, 0.5, 0.6, 0xf2c94c, doorX + out * 0.2, 0.5, z + 2.9));
  }
  // office with windows
  g.add(box(22, 8, 14, 0xdbe4ee, ox, 0, oz), box(22.6, 0.5, 14.6, 0xb9cbe0, ox, 8, oz));
  for (let i = 0; i < 5; i++) for (const fl of [1.6, 5]) for (const sz of [-1, 1]) g.add(box(2.2, 1.6, 0.1, 0, ox - 8.8 + i * 4.4, fl, oz + sz * 7.03, winMat));
  // parked trailers in rows
  for (let x = parkX0; x < parkX1; x += 4.5) for (let z = parkZ0; z < parkZ1; z += 18) {
    if (rnd() < 0.18) continue;
    g.add(box(2.5, 3.4, 12, 0xf4f6f8, x, 0.9, z));
    g.add(box(2.52, 0.6, 2, rnd() < 0.3 ? 0xd9534f : 0x8b98a8, x, 2.4, z + 5));
    g.add(box(2, 0.9, 11, 0x2b3340, x, 0, z));
  }
  // lamps along the road inside the yard
  for (let z = lampsFrom; Math.sign(lampsTo - lampsFrom) * (lampsTo - z) > 0; z += Math.sign(lampsTo - lampsFrom) * 22) {
    const i = Math.round(uAtZ(z) * N), p = pts[i];
    const x = p.x - 8;
    g.add(box(0.25, 7, 0.25, 0x4b5563, x, 0, z), box(1.6, 0.25, 0.4, 0x4b5563, x + 0.7, 7, z), box(0.8, 0.25, 0.7, 0, x + 1.3, 6.85, z, lampMat));
  }
  bake(g);
  taken.push({ x: 0, z: (z0 + z1) / 2, r: Math.abs(z1 - z0) / 2 });
}
depot({ z0: 700, z1: 548, gateZ: 548, wx0: 14, wx1: 46, wz0: 690, wz1: 600, ox: -45, oz: 610, parkX0: -100, parkX1: -60, parkZ0: 630, parkZ1: 690, lampsFrom: 690, lampsTo: 560 });
depot({ z0: -828, z1: -990, gateZ: -828, wx0: -44, wx1: -13, wz0: -955, wz1: -870, ox: 45, oz: -900, parkX0: 60, parkX1: 100, parkZ0: -980, parkZ1: -930, lampsFrom: -840, lampsTo: -935 });

// ── fields ────────────────────────────────────────────────────────────────
function fields(z0, z1, cotton) {
  for (let z = z0; z < z1;) {
    const d = 22 + rnd() * 26;
    for (let x = -330; x < 330;) {
      const w = 26 + rnd() * 40;
      const cx = x + w / 2, cz = z + d / 2;
      if (distToRoad(cx, cz) > Math.max(w, d) / 2 + 9 && free(cx, cz, Math.max(w, d) / 2 - 4) && rnd() < 0.88) {
        const g = new THREE.PlaneGeometry(w - 3, d - 3);
        const uv = g.attributes.uv, along = rnd() < 0.5;
        for (let i = 0; i < uv.count; i++) {
          const a = uv.getX(i), b = uv.getY(i);
          uv.setXY(i, along ? a * (w / 6) : b * (d / 6), along ? b * (d / 6) : a * (w / 6));
        }
        const f = M(g, cotton ? cottonMat : pick(fieldMats));
        f.rotation.x = -Math.PI / 2;
        f.position.set(cx, 0.02, cz);
        bake(f, false);
      }
      x += w;
    }
    z += d;
  }
}
fields(-50, 535, false);
fields(-810, -545, true);

// ── trees ─────────────────────────────────────────────────────────────────
const trees = [];
const addTree = (x, z, poplar) => trees.push(poplar
  ? { x, z, poplar, h: 10 + rnd() * 4, r: 1.3 + rnd() * 0.4, color: pick(P.trees) }
  : { x, z, poplar, h: 4 + rnd() * 2, r: 2.4 + rnd() * 1.4, color: pick(P.trees) });
for (let s = 30; s < ROAD_LEN; s += 7) {

function sky(minute, extraAz) {

  C(5, hemi.color); C(6, hemi.groundColor); hemi.intensity = L(7);

  { S: 10.5, u: U.client, m: 910, shot: "client" },
  { S: 11.4, u: U.fgGate, m: 1035, shot: "client" },
  { S: 11.9, u: U.drop, m: 1050, shot: "deliver" },
  { S: 12.6, u: U.drop, m: 1062, shot: "deliver" },
  { S: 13.3, u: U.drop, m: 1090, shot: "final" },
  { S: 14.0, u: U.drop, m: 1095, shot: "final" },
];
// chapter cards: [from S, index into TEXT]
const CARDS = [[0, 0], [1.0, 1], [2.3, 2], [3.3, 3], [4.2, 4], [5.8, 5], [7.5, 6], [8.8, 7], [10.2, 8], [11.6, 9], [13.0, 10]];
const LAST = K[K.length - 1].S;
document.body.style.height = `${(LAST + 1) * 100}vh`;

const up = new THREE.Vector3(0, 1, 0);
const tmp = new THREE.Vector3();
let clock = 0;
const routeC = (() => { const b = new THREE.Box3().setFromPoints(pts); return b.getCenter(new THREE.Vector3()); })();
const routeLen = Math.abs(pts[0].z - pts[N].z);

function shot(name, p, f, S) {
  const r = new THREE.Vector3(-f.z, 0, f.x);
  const k = narrow() ? 1.35 : 1;
  const out = { pos: new THREE.Vector3(), look: new THREE.Vector3(), fov: 38 };
  const dirAt = (deg) => f.clone().multiplyScalar(Math.cos(THREE.MathUtils.degToRad(deg))).addScaledVector(r, Math.sin(THREE.MathUtils.degToRad(deg)));
  switch (name) {
    case "hero": {
      out.pos.copy(p).addScaledVector(dirAt(-34), 23 * k).addScaledVector(up, 5);
      out.pos.x += Math.sin(clock * 0.35) * 1.2;
      out.pos.y += Math.sin(clock * 0.27) * 0.4;
      out.look.copy(p).addScaledVector(up, 2.2).addScaledVector(f, 1);
      break;
    }
    case "side":
      out.pos.copy(p).addScaledVector(r, -17 * k).addScaledVector(f, 3).addScaledVector(up, 5);
      out.look.copy(p).addScaledVector(up, 2.3);
      break;
    case "dock":
      out.pos.copy(p).addScaledVector(f, -15 * k).addScaledVector(r, -9 * k).addScaledVector(up, 6);
      out.look.copy(p).addScaledVector(f, -3).addScaledVector(up, 2);
      break;
    case "travel": // ahead of the truck, looking back at it: it drives down the screen
      out.pos.copy(p).add(tmp.set(0, narrow() ? 105 : 74, narrow() ? -130 : -104));
      out.look.copy(p).add(tmp.set(0, 0, -16));
      break;
    case "chai": {
      const c = tmp.set((p.x + CHAI.x) / 2, 0, (p.z + CHAI.z) / 2).clone();
      out.pos.copy(c).add(new THREE.Vector3(-48, 26, -38).multiplyScalar(k));
      out.look.copy(c);
      break;
    }
    case "pass":
      out.pos.copy(p).add(new THREE.Vector3(80, 170, -215).multiplyScalar(k));
      out.look.copy(p).add(tmp.set(0, 0, -25));
      break;
    case "back": { // look back over the pass while the wave runs
      const mid = pts[Math.round((iOff + iOn) / 2)];
      out.pos.copy(p).add(new THREE.Vector3(30, 150, -150).multiplyScalar(k));
      out.look.copy(p).lerp(mid, 0.55);
      break;
    }
    case "client": { // from the Fergana gate: the receiver's view, a long lens
      const g = pts[I(U.fgGate)];
      out.pos.set(g.x + 14, narrow() ? 30 : 22, g.z - 30);
      out.look.copy(p).addScaledVector(up, 2);
      out.fov = narrow() ? 26 : 20;
      break;
    }
    case "deliver": {
      const a = 105 - 75 * smooth((S - 11.9) / 0.7);
      out.pos.copy(p).addScaledVector(dirAt(a), 22 * k).addScaledVector(up, 5);
      out.look.copy(p).addScaledVector(up, 1.9);
      break;
    }
    case "plan":
    case "final": { // the whole trip from above: plan first, the track at the end
      // on a phone the card covers the bottom, so the whole route goes higher and smaller
      const H = (routeLen / 2 / Math.tan(THREE.MathUtils.degToRad(19))) * (narrow() ? 1.45 : 1.06);
      out.look.copy(routeC);
      out.pos.copy(routeC).add(tmp.set(0, H * Math.sin(1.22), -H * Math.cos(1.22)));
      break;
    }
  }
  return out;
}

// ── labels ────────────────────────────────────────────────────────────────
const labels = [];
function label(text, pos, cls = "") {
  const el = document.createElement("div");
  el.className = "label " + cls;
  el.innerHTML = cls.includes("tag") || cls.includes("area") ? text : `<i></i>${text}`;
  document.body.append(el);
  // place names only from afar: up close they would show through buildings
  const o = { el, pos, on: () => camDist > 90 };
  labels.push(o);
  return o;
}
label("Ташкент · склад", new THREE.Vector3(-45, 12, 610));
label("Чайхана", new THREE.Vector3(CHAI.x + 10, 8, CHAI.z + 14));
label("Перевал Камчик · 2268 м", new THREE.Vector3(-95, 25, -330), "area");
label("Фергана · склад", new THREE.Vector3(45, 12, -900));
const tagA = label("Погрузка", pinA.position.clone().setY(11), "tag pickup");
const tagB = label("Выгрузка", pinB.position.clone().setY(11), "tag dropoff");
const tagPhone = label("точки копятся в телефоне", new THREE.Vector3(), "tag phone");
const v = new THREE.Vector3();
let camDist = 0;
function placeLabels() {
  for (const o of labels) {
    const show = o.on();
    v.copy(o.pos).project(camera);
    const vis = show && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    o.el.style.display = vis ? "" : "none";
    if (vis) o.el.style.transform = `translate(${((v.x + 1) / 2) * innerWidth}px, ${((1 - v.y) / 2) * innerHeight}px) translate(-50%, -50%)`;
  }
}

// ── per frame ─────────────────────────────────────────────────────────────
const st = { u: U.dock, m: 460, pos: new THREE.Vector3(), look: new THREE.Vector3(), fov: 38, first: true, lastS: 0, extraAz: 0 };
const fmt = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;
const cardEl = document.getElementById("card"), clockEl = document.getElementById("clock"), stepEl = document.getElementById("step"), titleEl = document.getElementById("title"), textEl = document.getElementById("text"), flashEl = document.getElementById("flash");
let cardIdx = -1;
const m4 = new THREE.Matrix4(), hidden = new THREE.Matrix4().makeScale(0, 0, 0);

function frame(dt) {
  clock += dt;
  const S = Math.min(LAST, scrollY / innerHeight);
  let j = 1;
  while (j < K.length - 1 && K[j].S < S) j++;
  const a = K[j - 1], b = K[j];
  const t = clamp01((S - a.S) / (b.S - a.S));
  // easing per second, so it feels the same at 30 and 120 fps
  const ease = (rate) => 1 - Math.exp(-rate * dt);
  st.u += (a.u + (b.u - a.u) * t - st.u) * ease(5);
  st.m += (a.m + (b.m - a.m) * t - st.m) * ease(5);

  const i = Math.min(N, Math.max(0, Math.round(st.u * N)));
  const p = road.getPointAt(Math.min(1, st.u)), f = road.getTangentAt(Math.min(1, st.u));
  truck.position.set(p.x, 0, p.z);
  truck.rotation.y = Math.atan2(-f.x, -f.z);
  const fwd = new THREE.Vector3(f.x, 0, f.z).normalize();

  // camera: blend the two shots of this stretch, then ease toward it
  const A = shot(a.shot, p, fwd, S), B = shot(b.shot, p, fwd, S), w = smooth(t);
  const wantPos = A.pos.lerp(B.pos, w), wantLook = A.look.lerp(B.look, w), wantFov = A.fov + (B.fov - A.fov) * w;
  if (st.first) { st.pos.copy(wantPos); st.look.copy(wantLook); st.fov = wantFov; st.first = false; }
  st.pos.lerp(wantPos, ease(3.2));
  st.look.lerp(wantLook, ease(4));
  st.fov += (wantFov - st.fov) * ease(3.5);
  camera.position.copy(st.pos);
  camera.lookAt(st.look);
  camera.fov = st.fov;
  // keep the subject in the upper part of the screen (cards sit below)
  const ky = narrow() ? 0.4 : 0.46;
  camera.setViewOffset(innerWidth, innerHeight, 0, (0.5 - ky) * innerHeight, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  const d = st.pos.distanceTo(st.look);
  scene.fog.near = d * 0.9 + 60;
  scene.fog.far = d * 2.0 + 420;

  // light of the hour; at the chaikhana the shadows swing while it stands
  st.extraAz += (24 * clamp01((S - 6.1) / 0.8) - st.extraAz) * ease(5);
  sky(st.m, st.extraAz);
  sun.target.position.copy(st.look);
  sun.position.copy(st.look).addScaledVector(sunDir, 600);
  const ext = Math.min(1100, Math.max(70, d * 0.75));
  const sc = sun.shadow.camera;
  if (Math.abs(sc.right - ext) > 1) { sc.left = sc.bottom = -ext; sc.right = sc.top = ext; sc.far = 1400; sc.updateProjectionMatrix(); }

  // plan: draws itself pickup → dropoff in chapter 1, then only what is ahead
  const planR = smooth((S - 1.15) / 0.75);
  const planTo = S < 1.1 ? iDock : iDock + (iDrop - iDock) * planR;
  const planFrom = Math.max(iDock, i + 8);
  const far = smooth((d - 380) / 500);
  const spacing = Math.max(1, Math.round(d / 260));
  planDots.forEach((pi, k) => {
    const on = pi <= planTo && pi >= planFrom && k % spacing === 0 && far < 0.95;
    planMesh.setMatrixAt(k, on ? m4.compose(tmp.set(pts[pi].x, 0.1, pts[pi].z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1).multiplyScalar(Math.max(1, d / 160))) : hidden);
  });
  planMesh.instanceMatrix.needsUpdate = true;
  showRange(fatPlan, planFrom, planTo);
  fatPlanMat.opacity = far;
  pinA.visible = pinB.visible = S > 1.2 && d > 90; // up close the ring on the ground marks the spot
  pinA.scale.setScalar(Math.max(1, d / 150));
  pinB.scale.setScalar(Math.max(1, d / 150));
  tagA.on = () => S > 1.3 && S < 4.6 && d > 90;
  tagB.on = () => S > 1.3 && d > 90;

  // track: blue behind the truck; on the pass grey points wait on the phone
  const wave = smooth((S - 9.0) / 0.6);
  const held = Math.min(i, iOn);
  showRange(trackA, iDock, i);
  showRange(trackB, iOff, iOff + (held - iOff) * wave);
  showRange(trackC, iOn, i);
  showRange(fatTrack, iDock, S > 13 ? iDrop : i < iOff || wave > 0.99 ? i : iOff);
  fatTrackMat.opacity = far;
  let n = 0;
  for (const oi of offDots) if (oi <= i) n++;
  offMesh.count = n;
  const wf = iOff + (held - iOff) * wave;
  waveFront.visible = wave > 0.01 && wave < 0.99;
  if (waveFront.visible) { const q = pts[Math.round(wf)]; waveFront.position.set(q.x, 0.2, q.z); waveFront.scale.setScalar(1 + 0.25 * Math.sin(clock * 9)); }
  tagPhone.pos.copy(p).setY(9);
  tagPhone.on = () => i > iOff && i < iOn + 30 && wave < 0.05;
  tagPhone.el.textContent = `${n} точек в телефоне`;

  // steps: the photo at loading, the mark at delivery
  if (S > 3.45 && st.lastS <= 3.45) { flashEl.style.transition = "none"; flashEl.style.opacity = "0.9"; requestAnimationFrame(() => { flashEl.style.transition = "opacity .6s"; flashEl.style.opacity = "0"; }); }
  ringA.visible = S > 3.45;
  ringB.visible = S > 12.2;
  st.lastS = S;

  // chapter card
  let ci = 0;
  while (ci < CARDS.length - 1 && CARDS[ci + 1][0] <= S) ci++;
  if (ci !== cardIdx) {
    cardIdx = ci;
    const c = TEXT[CARDS[ci][1]];
    cardEl.classList.toggle("hero", ci === 0);
    stepEl.textContent = ci > 0 && ci < 10 ? `${ci} из 9` : "";
    titleEl.textContent = c.title;
    textEl.textContent = c.text;
  }
  clockEl.textContent = fmt(st.m);

  camDist = d;
  placeLabels();
  renderer.render(scene, camera);
}

let frames = 0, since = performance.now(), last = performance.now();
const fpsEl = document.getElementById("fps");
renderer.setAnimationLoop(() => {
  const now = performance.now();
  frame(Math.min(0.1, (now - last) / 1000));
  last = now;
  frames++;
  if (now - since > 500) { fpsEl.textContent = `${Math.round((frames * 1000) / (now - since))} fps · ${renderer.info.render.calls} dc`; frames = 0; since = now; }
});
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
});
</script>
</body>
</html>
